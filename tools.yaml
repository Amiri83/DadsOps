# DadsOps tool registry for a source checkout.
# Same tools as the packaged default: console scripts that `python3 -m dadsops` installs into
# this repo's .venv from PyPI, so cloning just this repo is enough. To run an unreleased
# tool, `pip install -e ../<tool>` into .venv (an editable install wins over the PyPI copy),
# or add `path: ../<tool>` to its entry (relative to this file) to run inside a checkout.
# Placeholders in start_command: {port} {profile} {region} {log_dir}.
# Each tool gets PORT, AWS_PROFILE, AWS_REGION and DADSOPS_LOG_DIR in its env.
# Per-app port, profile, enabled and extra args are set on the Settings page and win over this file.
tools:
  - name: EC2Patcher
    description: Patch EC2 servers from CVE lists
    package: ec2patcher
    start_command: ec2patcher --port {port}
    port: 8081

  - name: IPLens
    description: Private IP usage per subnet/ENI
    package: aws-iplens
    start_command: iplens --port {port}
    port: 8082

  - name: TFLens
    description: "Explain Terraform repos: resources, access, code refs"
    package: aws-tflens
    start_command: tflens serve --port {port}
    port: 8083

  - name: RoleLens
    description: Visualize and edit IAM roles, export JSON/HCL
    start_command: rolelens --port {port}
    port: 8084
    coming_soon: true
