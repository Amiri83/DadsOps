name: Publish to PyPI

# Push a tag like v0.1.0 to publish. The tag must match dadsops.__version__.
# Uses PyPI Trusted Publishing (OIDC): no API token is stored anywhere. Configure the trusted
# publisher on PyPI for this repository, workflow "publish.yml" and environment "pypi".
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check tag matches version
        run: |
          version=$(python -c "import dadsops; print(dadsops.__version__)")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match dadsops.__version__ $version" >&2
            exit 1
          fi
      - name: Test
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          ruff check .
          ruff format --check .
          python -m pytest -q
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/dadsops/
    permissions:
      id-token: write  # Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
